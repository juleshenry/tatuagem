[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tatuagem"
version = "0.1.15"
authors = [
  { name="Julian Henry", email="juliant@naver.com"},
  {name="Derek Dickerson", email="derekdson67@gmail.com" }
]
maintainers = [
  { name="Julian Henry", email="juliant@naver.com"},
  {name="Derek Dickerson", email="derekdson67@gmail.com" }
]
description = "A tool to generate ASCII art signatures (tattoos) and apply them to your code files recursively."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["ascii-art", "banner", "cli", "source-headers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "anybadge"]

[project.urls]
Homepage = "https://github.com/juleshenry/tatuagem"
Issues = "https://github.com/juleshenry/tatuagem/issues"
Changelog = "https://github.com/juleshenry/tatuagem/blob/main/CHANGELOG.md"

[project.scripts]
tatuagem = "tatuagem:main"

[tool.setuptools]
packages = ["tatuagem"]
include-package-data = true

[tool.setuptools.package-data]
tatuagem = ["*.json", "py.typed", "fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["hello_worlds"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/hello_worlds", "test_tattoo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# stacked tattoo docstrings come before the imports
"tatuagem/core.py" = ["E402", "I001"]
